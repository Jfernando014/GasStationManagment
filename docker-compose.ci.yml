version: '3.8'

services:
  backend:
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/target
    mem_limit: 4g
    shm_size: '2gb'
    environment:
      - JAVA_TOOL_OPTIONS=-Xint -Xmx2g -XX:MaxMetaspaceSize=256m -Dspring.devtools.restart.enabled=false -Djava.awt.headless=true
      - MAVEN_OPTS=-Xint -Xmx512m
