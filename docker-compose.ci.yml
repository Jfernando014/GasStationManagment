version: '3.8'

services:
  backend:
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /app/target
    mem_limit: 6g        
    shm_size: '2gb'
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx4g -XX:MaxMetaspaceSize=512m -Djava.awt.headless=true
      - MAVEN_OPTS=-Xmx4g -XX:MaxMetaspaceSize=512m