version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/target:/app/target

  frontend:
    volumes:
      - /dev/null:/app/node_modules_mock
