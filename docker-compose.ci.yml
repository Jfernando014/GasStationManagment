version: '3.8'

services:
  backend:
    profiles:
      - donotstartin_ci
  frontend:
    volumes:
      - /dev/null:/app/node_modules_mock
  backend-tests:
    command: ["tail", "-f", "/dev/null"]
    mem_limit: 4g
    shm_size: '2gb'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx3g -XX:MaxMetaspaceSize=384m -Djava.awt.headless=true
