version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    entrypoint: ["echo", "Backend de desarrollo omitido en CI"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  frontend:
    depends_on: [] 
    volumes:
      - /dev/null:/app/node_modules_mock
  backend-tests:
    command: ["tail", "-f", "/dev/null"]
    mem_limit: 4g
    shm_size: '2gb'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx3g -XX:MaxMetaspaceSize=384m -Djava.awt.headless=true
