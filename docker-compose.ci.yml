version: '3.8'

services:
  backend:
    mem_limit: 4g
    shm_size: '2gb'
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx2560m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -Dspring.devtools.restart.enabled=false -Djava.awt.headless=true
      - MAVEN_OPTS=-Dsurefire.forkCount=0 -Dsurefire.useManifestOnlyJar=false -Dmaven.compiler.parameters=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  frontend:
    volumes:
      - /dev/null:/app/node_modules_mock
