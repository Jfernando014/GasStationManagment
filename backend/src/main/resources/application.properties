
server.port=${SERVER_PORT}

spring.application.name=gas-station-backend

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=${SWAGGER_PATH}
springdoc.api-docs.path=${API_DOCS_PATH}

spring.servlet.multipart.max-file-size=${BACKUP_MAX_FILE_SIZE:512MB}
spring.servlet.multipart.max-request-size=${BACKUP_MAX_REQUEST_SIZE:520MB}
spring.mvc.async.request-timeout=${BACKUP_ASYNC_TIMEOUT:600000}

# Tabla para el control de eventos
spring.modulith.events.jdbc.schema-initialization.enabled=true
spring.modulith.events.republish-outstanding-events-on-restart=true

# Permitir migraciones Flyway intercaladas entre ramas
spring.flyway.out-of-order=true

# CORS: origenes/patrones permitidos separados por coma. Se define por entorno para cada LAN.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Seguridad: secreto/duracion del JWT y credenciales del administrador inicial (via entorno).
application.security.jwt.secret-key=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

# Primer mes del total acumulado de incentivos (yyyy-MM); desde ahi el acumulado no se reinicia
incentives.accumulated-from=2025-11

# TEMPORAL: metas de combustible de ejemplo (inventadas) para revisar a mano la ganancia mientras Metas no las
# entrega. Solo tiene efecto con el perfil dev y nunca escribe en la base.
sales.fuel-targets.dev-stub.enabled=${SALES_FUEL_TARGETS_DEV_STUB:false}

# Database backups
backup.dir=${BACKUP_DIR:/app/backups}
backup.max-upload-bytes=${BACKUP_MAX_UPLOAD_BYTES:536870912}
backup.timeout-seconds=${BACKUP_TIMEOUT_SECONDS:600}
backup.restore-enabled=${BACKUP_RESTORE_ENABLED:true}
backup.restart-after-restore=${BACKUP_RESTART_AFTER_RESTORE:true}
backup.dump-command=${PG_DUMP_COMMAND:pg_dump}
backup.restore-command=${PG_RESTORE_COMMAND:pg_restore}
backup.confirmation-phrase=${BACKUP_CONFIRMATION_PHRASE:RESTAURAR}
backup.audit-limit=${BACKUP_AUDIT_LIMIT:20}
