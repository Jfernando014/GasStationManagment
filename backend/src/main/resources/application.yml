server:
  port: 8080

spring:
  application:
    name: gas-station-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/gasstation_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
