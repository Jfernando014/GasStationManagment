version: '3.8'

services:

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile  
        args:
          - FRONTEND_PROD_PORT=${FRONTEND_PROD_PORT}
      container_name: gas-station-frontend-prod
      restart: always
      ports:
        - "${FRONTEND_PROD_PORT}:${FRONTEND_PROD_PORT}" 
      depends_on:
        - backend

  backend:
    build:
      context: ./backend    
      dockerfile: Dockerfile
      args:
        - DOCKER_USER=${DOCKER_USER}
        - DOCKER_GROUP=${DOCKER_GROUP}
    container_name: gas-station-backend-prod
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=${SERVER_PORT}
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - JPA_DDL_AUTO=validate
      - JPA_SHOW_SQL=false
      - SWAGGER_PATH=${SWAGGER_PATH}
      - API_DOCS_PATH=${API_DOCS_PATH}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: gas-station-db-prod
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
