version: '3.8'

services:

  frontend:
      build:
        context: ./frontend
        dockerfile: Dockerfile  
      container_name: gas-station-frontend-prod
      restart: always
      ports:
        - "${FRONTEND_PROD_PORT:-80}:80"
      environment:
        - API_PROTOCOL=${API_PROTOCOL}
        - API_HOST=${API_HOST}
        - API_PORT=${SERVER_PORT}
      depends_on:
        - backend

  backend:
    build:
      context: ./backend    
      dockerfile: Dockerfile
      args:
        - DOCKER_USER=${DOCKER_USER}
        - DOCKER_GROUP=${DOCKER_GROUP}
    container_name: gas-station-backend-prod
    restart: always
    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=${SERVER_PORT}
      - DB_URL=jdbc:postgresql://db:5432/${POSTGRES_DB_NAME}
      - DB_USER=${POSTGRES_DB_USER}
      - DB_PASSWORD=${POSTGRES_DB_PASSWORD}
      - JPA_DDL_AUTO=validate
      - JPA_SHOW_SQL=false
      - SWAGGER_PATH=${SWAGGER_PATH}
      - API_DOCS_PATH=${API_DOCS_PATH}
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRATION=${JWT_EXPIRATION}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - BACKUP_DIR=/app/backups
      - BACKUP_RESTART_AFTER_RESTORE=true
    volumes:
      - backend_backups:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider -T 3 http://localhost:${SERVER_PORT}${API_DOCS_PATH} 2>&1 | grep -q 'HTTP/'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: gas-station-db-prod
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB_NAME}
      - POSTGRES_USER=${POSTGRES_DB_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DB_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DB_USER} -d ${POSTGRES_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  backend_backups:
