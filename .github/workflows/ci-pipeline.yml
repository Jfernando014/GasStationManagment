name: Pruebas de pull request a la rama main

on:
  pull_request:
    branches: [ main ]

jobs:
  test-application:
    runs-on: ubuntu-latest

    steps:

      - name: Descargar código de la rama que realiza el pull request
        uses: actions/checkout@v4

      - name: Configurar variables de entorno temporales
        run: |
          echo "FRONTEND_PORT=4200" >> .env
          echo "SERVER_PORT=8080" >> .env
          echo "POSTGRES_LOCAL_PORT=5432" >> .env
          echo "POSTGRES_DB_NAME=gas_station_db" >> .env
          echo "POSTGRES_DB_USER=postgres" >> .env
          echo "POSTGRES_DB_PASSWORD=postgres" >> .env
          echo "JPA_DDL_AUTO=update" >> .env
          echo "JPA_SHOW_SQL=true" >> .env
          echo "SWAGGER_PATH=/swagger-ui.html" >> .env
          echo "API_DOCS_PATH=/v3/api-docs" >> .env

      - name: Crear configuración de Docker para el Pipeline
        run: |
          echo "version: '3.8'
          services:
            backend:
              volumes:
                - /var/run/docker.sock:/var/run/docker.sock" > docker-compose.ci.yml

      - name: Construir y levantar contenedores con Docker Compose
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Esperar a que la base de datos esté lista
        run: |
          until [ "$(docker inspect --format='{{.State.Health.Status}}' gas-station-db-dev)" == "healthy" ]; do
            sleep 2
          done

      - name: Ejecutar pruebas del Backend (Java)
        run: docker exec --user root -e MAVEN_OPTS="-Xmx1024m -XX:MaxMetaspaceSize=256m" gas-station-backend-dev mvn clean test

      - name: Ejecutar pruebas del Frontend (Angular)
        run: docker exec gas-station-frontend-dev ./node_modules/.bin/vitest run --globals

      - name: Apagar contenedores
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
