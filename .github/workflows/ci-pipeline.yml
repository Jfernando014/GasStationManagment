name: Pruebas de pull request a la rama main

on:
  pull_request:
    branches: [ main ]

jobs:
  test-application:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código de la rama que realiza el pull request
        uses: actions/checkout@v4

      - name: Configurar variables de entorno temporales
        run: |
          echo "FRONTEND_PORT=4200" >> .env
          echo "SERVER_PORT=8080" >> .env
          echo "POSTGRES_LOCAL_PORT=5432" >> .env
          echo "POSTGRES_DB_NAME=gas_station_db" >> .env
          echo "POSTGRES_DB_USER=postgres" >> .env
          echo "POSTGRES_DB_PASSWORD=postgres" >> .env
          echo "JPA_DDL_AUTO=update" >> .env
          echo "JPA_SHOW_SQL=true" >> .env
          echo "SWAGGER_PATH=/swagger-ui.html" >> .env
          echo "API_DOCS_PATH=/v3/api-docs" >> .env

      - name: Construir imágenes y arrancar la base de datos
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml build backend frontend
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d db

      - name: Ejecutar pruebas del Backend (Java)
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml run --rm --no-deps backend mvn -B -ntp test

      - name: Arrancar el Backend y esperar a que esté listo
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d backend || {
            docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color backend
            exit 1
          }
          for attempt in $(seq 1 60); do
            state=$(docker inspect --format='{{.State.Status}}' gas-station-backend-dev)
            health=$(docker inspect --format='{{.State.Health.Status}}' gas-station-backend-dev)
            if [ "$health" = "healthy" ]; then
              echo "Backend en línea."
              exit 0
            fi
            if [ "$state" = "exited" ]; then
              echo "ERROR: El proceso del Backend terminó antes de estar listo."
              docker logs gas-station-backend-dev
              exit 1
            fi
            sleep 5
          done
          echo "ERROR: El Backend no quedó saludable dentro del tiempo esperado."
          docker logs gas-station-backend-dev
          exit 1

      - name: Arrancar el Frontend
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d frontend

      - name: Ejecutar pruebas del Frontend (Angular)
        run: |
          docker exec -e CI=true gas-station-frontend-dev npx ng test --no-watch

      - name: Apagar contenedores y limpiar volúmenes residuales
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v