<div class="view-container active" id="view-dashboard">
  <!-- 1. SIDEBAR FLOTANTE -->
  <aside class="app-floating-sidebar">
    
    <!-- Encabezado de Marca -->
    <div class="sidebar-brand-box jr-brand-inicio" routerLink="/" title="Ir al inicio" tabindex="0">
      <div class="brand-logo-tile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M3 22V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v17"/>
          <path d="M17 10h2a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/>
          <circle cx="10" cy="9" r="2"/>
        </svg>
      </div>
      <div class="brand-meta-group">
        <div class="brand-name-text">
          <span>EDS Bellavista</span>
          <span class="brand-live-dot"></span>
        </div>
        <span class="brand-desc-text">Gestión Operativa y Admin</span>
      </div>
    </div>

    <!-- Scroll de Módulos y Submódulos -->
    <div class="sidebar-nav-scroll">
      <div class="nav-label-pill">General</div>
      <button class="sidebar-action-btn" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
        <div class="btn-prefix-stack">
          <svg class="sidebar-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span>Panel principal</span>
        </div>
        <span class="active-notch"></span>
      </button>

      <div class="nav-label-pill">Operación</div>
      <button class="sidebar-action-btn" routerLink="/jornada" routerLinkActive="active">
        <div class="btn-prefix-stack">
          <svg class="sidebar-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
          <span>Jornada del día</span>
        </div>
        <span class="jr-nav-chip jr-nav-chip--pendiente">Pendiente</span>
        <span class="active-notch"></span>
      </button>
      <button class="sidebar-action-btn" routerLink="/historial" routerLinkActive="active">
        <div class="btn-prefix-stack">
          <svg class="sidebar-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>
          <span>Historial de jornadas</span>
        </div>
        <span class="active-notch"></span>
      </button>
      <button class="sidebar-action-btn" routerLink="/gastos" routerLinkActive="active">
        <div class="btn-prefix-stack">
          <svg class="sidebar-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 2v20l3-2 3 2 3-2 3 2 3-2 1 .7V2l-1 .7-3-2-3 2-3-2-3 2-3-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
          <span>Gastos</span>
        </div>
        <span class="active-notch"></span>
      </button>

      <div class="collapsible-group open">
        <button class="sidebar-action-btn">
          <div class="btn-prefix-stack">
            <svg class="sidebar-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>Personal</span>
          </div>
          <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div class="collapsible-sub-menu">
          <a class="sub-item-link sub-nav-item" routerLink="/personal/vendedores" routerLinkActive="active">Vendedores</a>
          <a class="sub-item-link sub-nav-item" routerLink="/personal/malla" routerLinkActive="active">Malla de turnos</a>
        </div>
      </div>
    </div>

    <!-- Pie de página del sidebar -->
    <div class="sidebar-bottom-pill">
      <span class="dot-green-pulse"></span>
      <span>Sede Popayán · En línea</span>
    </div>

  </aside>

  <!-- 2. CANVAS DERECHO FLOTANTE -->
  <div class="canvas-right-stack">

    <!-- HEADER FLOTANTE BLANCO -->
    <header class="app-floating-header">
      
      <div class="header-trail">
        <span class="trail-root">Inicio</span>
        <span class="trail-sep">/</span>
        <span class="trail-active">Panel principal</span>
      </div>

      <div class="header-action-tray">
        <div class="status-capsule-badge">
          <span class="dot-green-pulse"></span>
          <span>Operación Activa</span>
        </div>

        <!-- Botón de Cerrar Sesión -->
        <button class="btn-solid-primary" (click)="logout()" style="height: 34px; padding: 0 14px; border-radius: var(--radius-pill); font-size: 13px;">
          Cerrar sesión
        </button>
      </div>
    </header>

    <!-- VIEWPORT DEL DASHBOARD (AQUÍ SE RENDERIZAN LOS COMPONENTES HIJOS) -->
    <main class="dashboard-scroll-viewport">
      <router-outlet></router-outlet>
    </main>

  </div>
</div>
