<section class="jr-p6-card">
  <div class="jr-p6-card-cab">
    <b>Descargas del día</b>
    <span class="jr-p6-tenue" title="Formato exacto de los Excel pendiente de confirmar con el cliente">formato por validar</span>
  </div>
  <div class="jr-p6-descargas">
    @for (objItem of atrItems; track objItem.id) {
      <div class="jr-p6-descarga" [attr.title]="objItem.enabled ? null : 'Aún no disponible'">
        <span class="jr-p6-tipo">{{ objItem.type }}</span>
        <span class="jr-p6-descarga-nombre">{{ objItem.name }}</span>
        @if (isBusy(objItem.id)) {
          <span class="daily-downloads-status" role="status">Generando…</span>
        }
        <button
          type="button"
          class="jr-btn jr-btn--sec jr-btn--sm jr-p6-bajar"
          [attr.aria-label]="'Descargar ' + objItem.name"
          [attr.aria-busy]="isBusy(objItem.id)"
          [disabled]="isDisabled(objItem)"
          (click)="download(objItem)"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <path d="M7 10l5 5 5-5M12 15V3" />
          </svg>
        </button>
      </div>
    }
  </div>
  @if (atrMessage(); as objMessage) {
    <p
      class="daily-downloads-message"
      [class.daily-downloads-message--error]="objMessage.isError"
      [attr.role]="objMessage.isError ? 'alert' : 'status'"
    >
      {{ objMessage.text }}
    </p>
  }
</section>
