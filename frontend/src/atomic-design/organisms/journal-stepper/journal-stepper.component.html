<div class="stepper-container">
  <ul class="stepper">
    <li *ngFor="let step of steps" 
        [ngClass]="getStepClass(step.status)"
        [routerLink]="['./', getRouteForStep(step.stepNumber)]"
        routerLinkActive="active-route">
      <div class="step-circle">{{ step.stepNumber }}</div>
      <div class="step-label">{{ step.name }}</div>
      <!-- Line to next step -->
      <div class="step-line" *ngIf="step.stepNumber < 6"></div>
    </li>
  </ul>
</div>
