@if (open()) {
  <div
    class="confirm-modal-backdrop"
    role="presentation"
    tabindex="-1"
    (click)="onBackdropClick($event)"
    (keydown.escape)="!busy() && cancelled.emit()">
    <div
      class="confirm-modal-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="confirmModalTitle"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="$event.stopPropagation()">
      <div class="confirm-modal-header">
        <div class="confirm-modal-title-wrap">
          <div class="confirm-modal-icon" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18" />
              <path d="M8 6V4h8v2" />
              <path d="M6 6v14a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V6" />
              <path d="M10 11v6M14 11v6" />
            </svg>
          </div>
          <div>
            <h2 id="confirmModalTitle" class="confirm-modal-title">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="confirm-modal-subtitle">{{ subtitle() }}</p>
            }
          </div>
        </div>
        <button
          type="button"
          class="confirm-modal-close"
          [disabled]="busy()"
          aria-label="Cerrar confirmación"
          (click)="cancelled.emit()">✕</button>
      </div>

      <p class="confirm-modal-body">{{ message() }}</p>

      <div class="confirm-modal-actions">
        <button
          type="button"
          class="btn-confirm-cancel"
          [disabled]="busy()"
          (click)="cancelled.emit()">
          Cancelar
        </button>
        <button
          type="button"
          class="btn-confirm-danger"
          [disabled]="busy()"
          (click)="confirmed.emit()">
          {{ busy() ? 'Eliminando…' : confirmLabel() }}
        </button>
      </div>
    </div>
  </div>
}
