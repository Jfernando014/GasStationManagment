<ng-template #content>
  <ng-content>
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="10" />
      <path d="M12 16v-4M12 8h.01" />
    </svg>
  </ng-content>
</ng-template>
@if (link(); as route) {
  <a class="trigger trigger--inline trigger--link" [routerLink]="route" [queryParams]="linkParams()" [attr.aria-describedby]="id">
    <ng-container [ngTemplateOutlet]="content" />
  </a>
} @else {
  <button type="button" class="trigger" [class.trigger--inline]="inline()" [class.trigger--term]="term()" [class.trigger--help]="help()" [attr.aria-label]="inline() ? null : label()"
    [attr.aria-describedby]="id" [attr.aria-expanded]="open()" (click)="toggle()">
    <ng-container [ngTemplateOutlet]="content" />
  </button>
}
<span class="bubble" role="tooltip" [id]="id" [class.is-help]="help()" [class.is-open]="open()" [class.is-above]="position().above"
  [style.left.px]="position().left" [style.top.px]="position().top">
  {{ text() }}
  <span class="arrow" aria-hidden="true" [style.left.px]="position().arrowLeft"></span>
</span>
