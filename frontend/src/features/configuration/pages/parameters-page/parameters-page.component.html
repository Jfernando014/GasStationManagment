<div class="parameters-page">
  <nav class="parameters-tabs" aria-label="Grupos de parámetros">
    @for (tab of tabs; track tab.path) {
      <a class="parameters-tab" [routerLink]="tab.path" routerLinkActive="is-active"
        #link="routerLinkActive" [attr.aria-current]="link.isActive ? 'page' : null">{{ tab.label }}</a>
    }
  </nav>

  <router-outlet />
</div>

<app-toast />
