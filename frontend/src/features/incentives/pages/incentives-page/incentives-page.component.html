<div class="incentives-page">
  <nav class="incentives-tabs" aria-label="Secciones de incentivos">
    @for (tab of tabs; track tab.path) {
      @if (tab.enabled) {
        <a class="incentives-tab" [routerLink]="tab.path" routerLinkActive="is-active"
          #link="routerLinkActive" [attr.aria-current]="link.isActive ? 'page' : null">{{ tab.label }}</a>
      } @else {
        <span class="incentives-tab is-disabled">
          <app-info-tooltip [inline]="true" [text]="unavailableHint" [label]="tab.label">{{ tab.label }}</app-info-tooltip>
        </span>
      }
    }
  </nav>

  <router-outlet />
</div>

<app-toast />
